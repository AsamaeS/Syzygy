<!DOCTYPE html>
<html>
<head>
    <title>Syzygy Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #00ff88; margin: 40px; }
        h1 { color: #00ff88; }
        .metric { background: #111; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .metric h2 { margin: 0 0 10px; color: #fff; }
        .metric p { margin: 0; font-size: 24px; }
    </style>
</head>
<body>
    <h1>Syzygy — Distributed Microgrid Monitor</h1>
    <div class="metric"><h2>Active Nodes</h2><p id="nodes">--</p></div>
    <div class="metric"><h2>Curtailment Rate</h2><p id="curt">--</p></div>
    <div class="metric"><h2>Self-Consumption</h2><p id="self">--</p></div>
    <div class="metric"><h2>Fairness Index</h2><p id="fair">--</p></div>
    <script>
        const ws = new WebSocket('ws://' + window.location.host + '/ws');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            document.getElementById('nodes').innerText = Object.keys(data).length;
        };
        fetch('/api/metrics').then(r => r.json()).then(d => {
            document.getElementById('curt').innerText = (d.total_curtailment_kwh || 0).toFixed(2) + ' kWh';
            document.getElementById('self').innerText = ((d.self_consumption_rate || 0) * 100).toFixed(1) + '%';
            document.getElementById('fair').innerText = (d.jain_fairness_index || 0).toFixed(3);
        });
    </script>
</body>
</html>
